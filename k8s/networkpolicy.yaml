# Closes the in-cluster path to the admin routes.
#
# The app authorises admin actions on the presence of the
# Cf-Access-Authenticated-User-Email header, which only Cloudflare Access adds
# on the way in. That is a presence check, not verification -- any pod that can
# reach this Service can set the header itself and trigger a crawl of
# usd489.com. Cloudflare protects the path from the internet; this protects it
# from inside the cluster, so the tunnel really is the only ingress the README
# claims it is.
#
# Note this denies by default: if cloudflared ever moves out of k-cloudflare,
# or the tunnel is pointed at this Service from somewhere else, the site goes
# dark rather than warning. The namespace below is the only thing permitting
# traffic in.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: usd489-calendar-ingress
spec:
  # Selecting the pod at all switches it from allow-all to deny-all for the
  # listed policyTypes; only the rules below are then permitted.
  podSelector:
    matchLabels:
      app: usd489-calendar

  # Ingress only. Egress is left alone on purpose: a refresh has to reach
  # usd489.com and the Thrillshare CDN, whose addresses change, and vanilla
  # NetworkPolicy cannot match hostnames -- so locking egress down would mean
  # allowing 443 to everything anyway, for no real gain.
  policyTypes:
    - Ingress

  ingress:
    # The tunnel is the only thing that should ever talk to this Service.
    #
    # kubernetes.io/metadata.name is set automatically by Kubernetes on every
    # namespace (1.21+), so this selects k-cloudflare by name without needing a
    # hand-applied label on it.
    #
    # namespaceSelector and podSelector are keys of the SAME list item, which
    # means AND: the source must be the tunnel pod *and* be in k-cloudflare. As
    # two separate list items it would mean OR -- any pod in k-cloudflare, or
    # any pod labelled app=tunnel-talos in any namespace -- which is weaker
    # than it looks and easy to write by accident.
    #
    # app=tunnel-talos is the tunnel Deployment's own label; pod-template-hash
    # is deliberately not matched, since it changes on every rollout.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k-cloudflare
          podSelector:
            matchLabels:
              app: tunnel-talos
      ports:
        - port: http # the container's named port, 8489
          protocol: TCP
