name: build image

# Images are cut from release tags only. Nothing is built on a push to main or
# on a pull request.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# After a successful publish, the bump-manifests job pins the new version in
# k8s/kustomization.yaml on main, so `kubectl apply -k k8s/` deploys it.
on:
  push:
    tags: ["v*"]

# Deny by default; each job opts into only what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build once for amd64 and actually run it before publishing anything.
  smoke:
    name: build + smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build amd64 image into the local daemon
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: usd489-calendar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container
        run: |
          docker run -d --name ci \
            --read-only --tmpfs /tmp \
            -p 8489:8489 usd489-calendar:ci

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8489/readyz >/dev/null 2>&1; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became ready"
          docker logs ci
          exit 1

      - name: Check the endpoints
        run: |
          set -euo pipefail

          # Readiness must report data loaded from the baked-in seed, proving a
          # cold start needs no network access to usd489.com.
          curl -fsS http://127.0.0.1:8489/readyz | tee /tmp/readyz
          grep -q '"source": "seed"' /tmp/readyz

          # The UI shell and the JSON API.
          curl -fsS http://127.0.0.1:8489/ | grep -q 'Hays USD 489 Closures'
          curl -fsS http://127.0.0.1:8489/api/calendar -o /tmp/cal.json
          python3 -c "
          import json
          d = json.load(open('/tmp/cal.json'))
          assert d['events'], 'no events in API response'
          assert d['schoolYear'], 'no school year'
          print(f\"{len(d['events'])} events for {d['schoolYear']}\")
          "

          # The iCal feed must be parseable, with unique UIDs and all-day dates.
          curl -fsS http://127.0.0.1:8489/calendar.ics -o /tmp/feed.ics
          pip install --quiet icalendar
          python3 -c "
          from icalendar import Calendar
          import datetime as dt
          cal = Calendar.from_ical(open('/tmp/feed.ics','rb').read())
          evs = list(cal.walk('VEVENT'))
          assert evs, 'feed has no events'
          uids = [str(e['UID']) for e in evs]
          assert len(uids) == len(set(uids)), 'duplicate UIDs in feed'
          for e in evs:
              s = e['DTSTART'].dt
              assert isinstance(s, dt.date) and not isinstance(s, dt.datetime), \
                  f'{s!r} is not an all-day DATE value'
          print(f'{len(evs)} events, all UIDs unique')
          "

      - name: Container logs
        if: always()
        run: docker logs ci

  publish:
    name: publish to ghcr
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The bare version for this tag (v1.2.3 -> 1.2.3), used to pin the manifests.
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest is added automatically for semver tags (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # arm64 builds under QEMU; drop it if your cluster is amd64-only and
          # you'd rather have faster builds.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keeps the published manifest list free of unknown/unknown entries.
          provenance: false

      - name: Summary
        # Passed via env rather than interpolated into the script, so tag text
        # can never be expanded as shell code.
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  bump-manifests:
    name: pin new version in k8s/
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag may not sit on main's HEAD, so check out the branch we intend
      # to commit to rather than the tag itself.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Pin the published tag in kustomization.yaml
        working-directory: k8s
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::publish produced no version"; exit 1; }

          yq -i '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(VERSION)' kustomization.yaml

          # yq assigns nothing and still exits 0 when the selector matches no
          # entry, so confirm the tag actually landed rather than trusting it.
          yq -e '.images[] | select(.name == strenv(IMAGE) and .newTag == strenv(VERSION))' \
            kustomization.yaml >/dev/null \
            || { echo "::error::no images entry for $IMAGE in k8s/kustomization.yaml"; exit 1; }

          cat kustomization.yaml

      - name: Commit and push
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          # Used only at push time, so credentials are never written into
          # .git/config by the checkout step.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "k8s/kustomization.yaml already pinned to ${VERSION}; nothing to do"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(k8s): deploy ${VERSION}"

          # Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot loop back into another build.
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:main

          {
            echo "### Manifests pinned"
            echo
            echo "\`k8s/kustomization.yaml\` now deploys \`${VERSION}\`."
            echo
            echo "Deploy with: \`kubectl apply -k k8s/\`"
          } >> "$GITHUB_STEP_SUMMARY"
