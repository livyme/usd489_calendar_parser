# Monthly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem; majors get their own PRs so they can be reviewed (and reverted) on
# their own. Security updates are a repo setting and don't wait for this schedule.
#
# cooldown: wait a week after a release before proposing it, so a compromised
# or broken release has time to be caught and yanked upstream.

version: 2

updates:
  # Python (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(python)"

  # Actions in .github/workflows (kept SHA-pinned; Dependabot updates the SHA
  # and the version comment together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"

  # Base images in the Dockerfile (uv build image, python runtime)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      # pyproject.toml requires Python 3.14 and .python-version pins it; move
      # the images, those and the compose image together, by hand.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: "deps(docker)"

  # Image in docker-compose.yml (the uv dev image)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(compose)"
